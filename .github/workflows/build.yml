name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Web App into Android Assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -f index.html android/app/src/main/assets/www/index.html
          cp -f manifest.json sw.js icon-192.png icon-512.png android/app/src/main/assets/www/ || true

      - name: Compile Signed Installable APK
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../WordStudioPro-Android-Universal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordStudioPro-Android-APK
          path: WordStudioPro-Android-Universal.apk
        uses: actions/upload-artifact@v4
        with:
          name: WordStudioPro-Android-APK
          path: WordStudioPro-Android-Universal.apk
